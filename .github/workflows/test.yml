name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Fix node-pty spawn-helper permissions (macOS)
        if: runner.os == 'macOS'
        run: |
          for helper in node_modules/node-pty/build/Release/spawn-helper node_modules/node-pty/prebuilds/*/spawn-helper; do
            if [ -f "$helper" ]; then
              chmod +x "$helper" || true
              xattr -d com.apple.quarantine "$helper" 2>/dev/null || true
            fi
          done
      - run: npm test
